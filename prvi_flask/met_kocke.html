
<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 MET KOCKE</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 30%, #25205a, #090914 65%);
    color: white;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
}

.container {
    width: 90%;
    max-width: 600px;
    text-align: center;
    padding: 35px 20px;
}

h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(32px, 8vw, 55px);
    font-weight: 900;
    background: linear-gradient(90deg, #00f5ff, #a855f7, #ff36b5);
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 55px;
    letter-spacing: 3px;
    font-size: 12px;
}

.dice-area {
    display: flex;
    justify-content: center;
    gap: 25px;
    perspective: 800px;
    margin-bottom: 45px;
}

.dice {
    width: 110px;
    height: 110px;
    background: linear-gradient(145deg, #fff, #c9d1ff);
    color: #17152d;
    border-radius: 23px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 72px;
    box-shadow:
        0 0 20px #8b5cf6,
        0 15px 35px #0008;
    transition: transform .2s;
    user-select: none;
}

.rolling {
    animation: roll .15s infinite alternate;
}

@keyframes roll {
    from { transform: rotate(-15deg) scale(.9); }
    to { transform: rotate(15deg) scale(1.1); }
}

button {
    border: none;
    padding: 19px 55px;
    border-radius: 15px;
    background: linear-gradient(90deg, #7c3aed, #ec4899);
    color: white;
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 30px #a855f766;
    transition: .2s;
}

button:hover {
    transform: scale(1.07);
    box-shadow: 0 0 45px #ec4899aa;
}

button:active {
    transform: scale(.95);
}

.result {
    margin-top: 35px;
    font-size: 23px;
    font-weight: 800;
    color: #00f5ff;
    min-height: 35px;
}

.stats {
    margin-top: 35px;
    display: flex;
    justify-content: center;
    gap: 20px;
}

.stat {
    background: #ffffff0c;
    border: 1px solid #ffffff20;
    padding: 18px 25px;
    border-radius: 15px;
    min-width: 120px;
}

.stat small {
    display: block;
    color: #999;
    margin-bottom: 8px;
}

.stat strong {
    font-family: 'Orbitron';
    font-size: 25px;
    color: #c084fc;
}

.history {
    margin-top: 35px;
    color: #aaa;
    font-size: 14px;
}

#historyList {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
}

.history-item {
    padding: 8px 12px;
    background: #ffffff12;
    border-radius: 9px;
    color: white;
}

footer {
    margin-top: 45px;
    font-size: 11px;
    color: #555;
    letter-spacing: 2px;
}

@media(max-width: 400px) {
    .dice {
        width: 85px;
        height: 85px;
        font-size: 55px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>MET KOCKE</h1>
    <div class="subtitle">🎲 USTVARI SVOJO SREČO 🎲</div>

    <div class="dice-area">
        <div class="dice" id="dice1">⚀</div>
        <div class="dice" id="dice2">⚀</div>
    </div>

    <button onclick="rollDice()" id="rollButton">
        🎲 VRZI KOCKI
    </button>

    <div class="result" id="result">
        Si pripravljen?
    </div>

    <div class="stats">
        <div class="stat">
            <small>ŠTEVILO METOV</small>
            <strong id="throws">0</strong>
        </div>

        <div class="stat">
            <small>SKUPNI REZULTAT</small>
            <strong id="total">0</strong>
        </div>
    </div>

    <div class="history">
        ZGODOVINA METOV
        <div id="historyList">
            <span>Še ni metov...</span>
        </div>
    </div>

    <footer>MADE FOR LUCKY PEOPLE ✦</footer>

</div>

<script>
const diceFaces = ["⚀","⚁","⚂","⚃","⚄","⚅"];

let throws = 0;
let total = 0;
let rolling = false;
let history = [];

function rollDice() {
    if (rolling) return;

    rolling = true;

    const dice1 = document.getElementById("dice1");
    const dice2 = document.getElementById("dice2");
    const result = document.getElementById("result");
    const button = document.getElementById("rollButton");

    button.disabled = true;
    dice1.classList.add("rolling");
    dice2.classList.add("rolling");

    result.textContent = "🎲 KOCKI SE VRTITA...";

    let animation = setInterval(() => {
        dice1.textContent = diceFaces[Math.floor(Math.random() * 6)];
        dice2.textContent = diceFaces[Math.floor(Math.random() * 6)];
    }, 100);

    setTimeout(() => {
        clearInterval(animation);

        let a = Math.floor(Math.random() * 6) + 1;
        let b = Math.floor(Math.random() * 6) + 1;
        let sum = a + b;

        dice1.textContent = diceFaces[a - 1];
        dice2.textContent = diceFaces[b - 1];

        dice1.classList.remove("rolling");
        dice2.classList.remove("rolling");

        throws++;
        total += sum;

        document.getElementById("throws").textContent = throws;
        document.getElementById("total").textContent = total;

        if (a === 6 && b === 6) {
            result.textContent = "🔥 NEVERJETNO! DVE ŠESTICI!";
        } else if (sum === 7) {
            result.textContent = "✨ SEDMICA! SREČA!";
        } else if (sum === 2) {
            result.textContent = "💀 NAJMANJŠI MOŽNI REZULTAT!";
        } else {
            result.textContent = `REZULTAT: ${a} + ${b} = ${sum}`;
        }

        history.unshift(`${a} + ${b} = ${sum}`);
        history = history.slice(0, 8);

        document.getElementById("historyList").innerHTML =
            history.map(item =>
                `<span class="history-item">${item}</span>`
            ).join("");

        button.disabled = false;
        rolling = false;

    }, 1200);
}
</script>

</body>
</html>
